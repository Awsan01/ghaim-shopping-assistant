<style>
/* VOICE everyday retail: a warm, polished Gulf perfume boutique talking to a shopper
   IDEA the boutique's own concierge chat; product cards read like shelf tags beside the bottle
   PICTURE the live chat itself, each recommended product drawn as its own bottle
   COLOUR burgundy and gold kept from the boutique, on a light blush ground with white surfaces
   TYPE Aref Ruqaa for the store mark, IBM Plex Sans Arabic for everything else
   LAYOUT laptop: chat column with a how-it-works panel beside it; phone: full-screen chat, quick replies above a floating composer */
:root{color-scheme:light dark;--bg:light-dark(#faf3f5,#130a0e);--ink:light-dark(#2b1119,#f6e9ed);--mut:light-dark(#7d6068,#b89ba4);--card:light-dark(#ffffff,#21131a);--line:light-dark(#efe1e5,#33212a);--brand:#5a1430;--bink:light-dark(#5a1430,#f1c6d4);--ub:light-dark(#5a1430,#7c2346);--ubh:light-dark(#47102a,#8e2a52);--gold:#c9a24a;--goldh:#b38d3a;--goldink:light-dark(#86661c,#e4c47c);--goldbg:light-dark(#f7efdc,#2e2516);--ok:light-dark(#2d774c,#86d3a6);--okbg:light-dark(#e6f3eb,#173023);--low:light-dark(#985800,#f0b45c);--lowbg:light-dark(#fbefdc,#33260f);--out:light-dark(#a3303f,#f28d9b);--outbg:light-dark(#f9e4e7,#3a1a20);--tint:light-dark(#f4eaee,#2a1a21);--tint2:light-dark(#ecdde3,#352129);--hobg:light-dark(#fbf4e4,#2a2116);--sh:0 1px 2px rgba(43,17,25,.06),0 6px 18px rgba(43,17,25,.06);--wabg:light-dark(#efeae2,#0b141a);--wadot:light-dark(#0000000d,#ffffff0a);--wapanel:light-dark(#f0f2f5,#202c33);--wain:light-dark(#ffffff,#202c33);--waout:light-dark(#d9fdd3,#005c4b);--waoutink:light-dark(#111b21,#e9edef);--walink:light-dark(#008069,#53bdeb);--wainput:light-dark(#ffffff,#2a3942);--wanotebg:light-dark(#fdf4c5,#182229);--wanoteink:light-dark(#54656f,#ffd279);--watime:light-dark(#667781,#8696a0)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .18s,color .18s,box-shadow .18s,border-color .18s,transform .12s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px max(16px,4vw)}
.bar,.tabs{max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.logo{width:46px;height:46px;border-radius:15px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.name{font:700 26px/1.15 "Aref Ruqaa","IBM Plex Sans Arabic",serif;color:var(--bink)}
.sub{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#e8c46a;flex:none}
.dot.on{background:#3fbf7f;box-shadow:0 0 0 3px rgba(63,191,127,.22)}
.dot.off{background:#e8798a}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--tint);color:var(--bink);display:grid;place-items:center;position:relative;font-weight:600;flex:none}
.ib:hover{background:var(--tint2)}
.ib svg{width:21px;height:21px}
.badge{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#2b1119;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tabs{margin-top:12px}
.segt{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--tint);max-width:480px}
.tab{flex:1;height:40px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:600;font-size:15px;white-space:nowrap}
.tab:hover{color:var(--bink)}
.tab[aria-selected=true]{background:var(--card);color:var(--bink);box-shadow:0 1px 3px rgba(43,17,25,.14)}
.cnt{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:10px;background:var(--gold);color:#2b1119;font-size:12px;line-height:20px}
.note{margin:0;font-size:13px;color:var(--mut);text-align:center;padding:8px 16px 0}
main{min-height:0;width:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
@media(min-width:980px){main{grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-inline:24px}}
.col{min-height:0;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow-y:auto;padding:20px max(16px,3vw) 12px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:min(88%,560px);align-self:flex-start}
.msg.me{align-self:flex-end}
.msg.wide{max-width:100%;align-self:stretch}
.enter{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.body{display:flex;flex-direction:column;min-width:0}
.av{width:34px;height:34px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.av svg{width:22px;height:22px}
.bub{background:var(--card);border-radius:20px;border-end-start-radius:6px;padding:12px 16px;align-self:flex-start;max-width:560px;box-shadow:var(--sh)}
.me .bub{background:var(--ub);color:#fff;border-end-start-radius:20px;border-end-end-radius:6px;box-shadow:0 4px 14px rgba(90,20,48,.18)}
.txt{overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:4px;margin:-2px 0 10px;padding:8px 10px;border-radius:12px;background:var(--tint)}
.steps:last-child{margin-bottom:0}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);line-height:1.4}
.step svg{width:15px;height:15px;flex:none;color:var(--ok)}
.step.run svg{color:var(--goldink);animation:spin 1s linear infinite}
.typing{display:flex;gap:5px;padding:8px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bob 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,70%,100%{transform:none;opacity:.35}35%{transform:translateY(-4px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--out);font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.retry,.ghost{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.retry:hover,.ghost:hover{border-color:var(--gold)}
.cards{display:flex;gap:12px;overflow-x:auto;padding:12px 4px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.pc{flex:none;width:204px;scroll-snap-align:start;background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .22s ease,box-shadow .22s ease}
.pc:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(43,17,25,.06),0 12px 28px rgba(43,17,25,.1)}
.ph{height:136px;display:grid;place-items:center;background:var(--c);overflow:hidden}
.ph svg{height:112px;width:76px;transition:transform .3s ease}
.pc:hover .ph svg{transform:translateY(-2px) rotate(-2deg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.pc:hover .ph img{transform:scale(1.04)}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.pb h4{margin:0;font-size:15px;line-height:1.35}
.fam{font-size:12px;color:var(--goldink);font-weight:600}
.nt{font-size:13px;color:var(--mut);line-height:1.45;min-height:2.9em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{font-size:13px;color:var(--mut)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0 10px}
.price{font-weight:700;font-size:17px;white-space:nowrap;color:var(--bink)}
.sk{font-size:12px;font-weight:600;white-space:nowrap;color:var(--ok);padding:2px 8px;border-radius:999px;background:var(--okbg)}
.sk.low{color:var(--low);background:var(--lowbg)}
.sk.out{color:var(--out);background:var(--outbg)}
.add{margin-top:auto;height:40px;border-radius:12px;border:0;background:var(--ub);color:#fff;font-weight:600;font-size:14px}
.add:hover{background:var(--ubh)}
.add:disabled{opacity:.6;cursor:not-allowed;background:var(--line);color:var(--mut)}
.ho{margin-top:10px;border-radius:16px;padding:12px 14px;background:var(--hobg);font-size:14px;max-width:360px;align-self:flex-start;box-shadow:var(--sh)}
.ho b{display:flex;align-items:center;gap:6px}
.ho b svg{width:18px;height:18px;color:var(--goldink);flex:none}
.mut{color:var(--mut)}
.wa{display:inline-flex;align-items:center;gap:8px;margin-top:10px;height:44px;padding:0 18px;border-radius:12px;background:#1d8a4b;color:#fff;text-decoration:none;font-weight:600}
.wa svg{width:18px;height:18px}
.composer{padding:6px max(16px,3vw) 8px;background:var(--bg)}
.pnote{margin:6px 0 0;font-size:11.5px;line-height:1.45;color:var(--mut);text-align:center}
.plan a{color:var(--bink);font-weight:600;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.plan a:hover{text-decoration-thickness:2px}
.err .plan{flex-basis:100%;margin:0;font-size:13px;line-height:1.5;color:var(--mut)}
.foot{margin:0;padding:2px 16px max(8px,env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips:empty{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap;animation:rise .3s ease both}
.chip:hover{border-color:var(--gold);color:var(--bink)}
.row{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:5px;padding-inline-start:8px;box-shadow:0 2px 6px rgba(43,17,25,.05),0 10px 26px rgba(43,17,25,.07);transition:border-color .18s}
.row:focus-within{border-color:var(--gold)}
#q{flex:1;height:44px;border:0;background:none;font-size:16px;padding:0 10px;outline:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#2b1119;display:grid;place-items:center;flex:none}
.send:hover{background:var(--goldh)}
.send svg{width:21px;height:21px}
[dir=rtl] .send .arr{transform:scaleX(-1)}
.side{display:none}
@media(min-width:980px){.side{display:block;overflow-y:auto;padding:24px 0}}
.side h3,.sh{font-size:19px;margin:0 0 6px}
.side h4{font-size:15px;margin:20px 0 10px}
.tool{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.tool>svg{width:38px;height:38px;padding:9px;border-radius:12px;flex:none;color:var(--goldink);background:var(--goldbg)}
.tool b{display:block;font-size:15px}
.tool span{font-size:14px;color:var(--mut)}
.orders{display:flex;flex-wrap:wrap;gap:8px}
.small{font-size:13px}
.tk{background:var(--card);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;max-width:640px;width:100%;box-shadow:var(--sh)}
.tk header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--goldbg);color:var(--goldink);white-space:nowrap}
.pill.done{background:var(--okbg);color:var(--ok)}
.tk p{margin:2px 0 0}
details summary{cursor:pointer;color:var(--mut);font-size:14px;min-height:32px;display:flex;align-items:center}
.tr{display:flex;flex-direction:column;gap:6px;font-size:14px;margin-top:6px}
.ghost{align-self:flex-start}
.empty{margin:auto;text-align:center;max-width:380px;color:var(--mut);padding:24px}
.empty svg{width:56px;height:56px;color:var(--gold)}
.empty h3{color:var(--ink);margin:8px 0 4px}
.sheet{position:fixed;inset:0;background:rgba(22,6,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.sheet.open .panel{animation:rise .28s cubic-bezier(.2,.7,.2,1) both}
.panel{background:var(--card);width:min(100%,460px);max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 22px max(22px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.12)}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:24px}}
.panel h3{margin:0 0 16px;font-size:20px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.fld label,.lbl{font-weight:600;font-size:15px}
.fld input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.hint{font-size:13px;color:var(--mut);margin:0}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--tint)}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--bink);box-shadow:0 1px 3px rgba(43,17,25,.14)}
.prim{width:100%;height:48px;border-radius:14px;border:0;background:var(--ub);color:#fff;font-weight:700;margin-top:12px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.line span:first-child{flex:1}
.line .price{font-size:15px}
.x{border:0;background:none;color:var(--out);font-size:13px;font-weight:600;height:36px}
.wahead,.tm{display:none}
#chatView.wamode .log{background-color:var(--wabg);background-image:radial-gradient(var(--wadot) 1px,transparent 1.4px);background-size:18px 18px}
#chatView.wamode .wahead{display:flex;align-items:center;gap:10px;padding:8px max(16px,3vw);background:var(--wapanel);border-bottom:1px solid var(--line)}
.wahead .av{width:40px;height:40px;border-radius:50%}
.wahead b{display:block;font-size:16px;line-height:1.3}
.wahead span{font-size:13px;color:var(--mut)}
.wanote{align-self:center;max-width:92%;text-align:center;font-size:13px;line-height:1.5;padding:6px 12px;border-radius:8px;background:var(--wanotebg);color:var(--wanoteink)}
#chatView.wamode .msg .av,#chatView.wamode .steps{display:none}
#chatView.wamode .bub{border:0;border-radius:10px;border-start-start-radius:0;box-shadow:0 1px .5px rgba(0,0,0,.13);padding:7px 10px 5px}
#chatView.wamode .bot .bub{background:var(--wain)}
#chatView.wamode .me .bub{background:var(--waout);color:var(--waoutink);border-start-start-radius:10px;border-start-end-radius:0;border-end-end-radius:10px}
#chatView.wamode .tm{display:block;font-size:11px;color:var(--watime);text-align:end;white-space:nowrap;margin-top:1px}
.ticks{color:#53bdeb;letter-spacing:-3px;margin-inline-start:2px}
#chatView.wamode .pc,#chatView.wamode .ho{border-radius:10px;box-shadow:0 1px .5px rgba(0,0,0,.13);background:var(--wain)}
#chatView.wamode .pc:hover{transform:none}
#chatView.wamode .price{color:var(--ink)}
#chatView.wamode .add{border:0;border-top:1px solid var(--line);border-radius:0;margin:4px -14px -14px;height:44px;background:none;color:var(--walink)}
#chatView.wamode .add:hover{background:none;color:var(--walink)}
#chatView.wamode .composer{background:var(--wapanel)}
#chatView.wamode .row{border:0;box-shadow:none;background:none;padding:0}
#chatView.wamode #q{background:var(--wainput);border-radius:24px;height:46px;padding:0 16px}
#chatView.wamode .send{background:#00a884;color:#fff}
#chatView.wamode .chip{border:0;border-radius:10px;background:var(--wain);color:var(--walink);font-weight:600;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.ch{font-size:13px;color:var(--mut)}
.nw{white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar">
      <div class="mark">
        <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="15" y="3" width="10" height="8" rx="2" fill="#c9a24a"/><rect x="17.5" y="11" width="5" height="4" fill="#a8822f"/><path d="M9 22q0-7 7-7h8q7 0 7 7v10q0 5-5 5H14q-5 0-5-5z" fill="none" stroke="#c9a24a" stroke-width="2.2"/><path d="M14 27h12" stroke="#c9a24a" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div>
          <div class="name" id="name">عطور غَيم</div>
          <div class="sub"><span class="dot" id="dot"></span><span id="status">جارٍ الاتصال…</span></div>
        </div>
      </div>
      <button type="button" class="ib" id="cartBtn" aria-label="السلة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="badge" id="cartN" hidden>0</span></button>
      <button type="button" class="ib" id="langBtn" aria-label="English">EN</button>
      <button type="button" class="ib" id="setBtn" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg></button>
    </div>
    <div class="tabs"><div class="segt" role="tablist">
      <button type="button" class="tab" role="tab" id="tabChat" aria-selected="true">الموقع</button>
      <button type="button" class="tab" role="tab" id="tabWa" aria-selected="false">واتساب</button>
      <button type="button" class="tab" role="tab" id="tabStaff" aria-selected="false">فريق الخدمة</button>
    </div></div>
  </header>
  <p class="note" id="note">متجر تجريبي: المنتجات والطلبات أمثلة لعرض المساعد.</p>

const CH={web:{},wa:{}};

function addToCart(id,q,c=chan()){const p=prod(id);if(!p||p.stock<=0)return false;const k=CH[c].cart;k[id]=Math.min((k[id]||0)+(q||1),p.stock);renderCartBadge();return true}
function cartSummary(c=chan()){const items=Object.entries(CH[c].cart).map(([id,q])=>{const p=prod(id);return{id,name_ar:p.ar,name_en:p.en,qty:q,price_sar:p.price}});return{items,total_sar:items.reduce((s,i)=>s+i.qty*i.price_sar,0)}}
function transcript(c=chan()){return CH[c].msgs.filter(m=>!m.welcome&&(m.role==='user'||clean(m.text))).map(m=>({who:m.role,text:m.role==='user'?m.text:clean(m.text)})).slice(-20)}
function makeTicket(reason,summary,id,ch){
  const old=id&&tickets.find(x=>x.id===id);if(old)return old;
  ch=ch||chan();
  const tk={id:id||'T-'+(1001+tickets.length),time:new Date().toISOString(),ch,reason:String(reason||'').slice(0,300),summary:String(summary||reason||'').slice(0,800),status:'waiting',transcript:transcript(ch)};
  tickets.push(tk);renderTabs();renderStaff();return tk;
}

const cap=(s,n)=>{const a=Array.from(s);return a.length>n?a.slice(0,n).join(''):s};
function buildTurns(c){
  return CH[c].msgs.filter(m=>!m.welcome&&!m.pending&&(m.role==='user'||String(m.text||'').trim())).slice(-16).map(m=>m.role==='user'?{role:'user',content:cap(String(m.text).trim(),1000)}:{role:'assistant',content:cap(String(m.text).trim(),2000)});
}
function chatBody(ch){
  return{messages:buildTurns(ch),channel:ch,speed:S.speed==='smart'?'smart':'fast',cart:Object.entries(CH[ch].cart).map(([id,qty])=>({id,qty})),open_tickets:tickets.filter(x=>x.status==='waiting'&&x.ch===ch).map(x=>x.id),next_ticket_id:'T-'+(1001+tickets.length),wa_button:!!S.wa};
}
async function askServer(body,signal){
  let res,data=null;
  try{res=await fetch('api/chat.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal,cache:'no-store'})}
  catch(e){if(signal.aborted)throw e;throw{code:'network'}}
  try{data=await res.json()}catch(e){if(signal.aborted)throw e}
  if(res.ok&&data&&typeof data.text==='string')return{text:data.text,actions:Array.isArray(data.actions)?data.actions:[],steps:Array.isArray(data.steps)?data.steps:[],truncated:!!data.truncated,refused:!!data.refused};
  const code=data&&data.error;
  if(res.status===429)throw{code:data&&data.scope==='site'?'site_limit':'rate_limited',until:Date.now()+1000*(Number(data&&data.retry_after)||Number(res.headers.get('Retry-After'))||60)};
  if(['paused','busy','too_large','bad_request'].includes(code))throw{code};
  if(res.status===413)throw{code:'too_large'};
  throw{code:res.status>=500&&!data?'busy':'other'};
}
function applyStep(s,r,bot,ch){
  const a=r.actions.find(x=>!x.used&&(s.k==='cart'?x.type==='add_to_cart'&&x.product_id===s.id:s.k==='hand'&&x.type==='handoff'&&x.ticket_id===s.id));
  if(!a)return;
  a.used=true;
  if(a.type==='add_to_cart')addToCart(a.product_id,a.quantity,ch);
  else bot.handoff=makeTicket(a.reason,a.summary,a.ticket_id,ch).id;
}

}

const planErr=m=>aiProvider==='gemini'&&['busy','rate_limited','site_limit'].includes(m.err);

async function send(text){
  text=cap(String(text||'').trim(),1000);
  if(!text)return;
  if(view==='staff')setView(lastChat==='wa'?'wa':'chat');
  const ch=chan(),st=CH[ch];
  if(st.busy)return;
  $('#q').value='';st.draft='';
  const m={id:uid(),role:'user',text,time:Date.now()};
  st.msgs.push(m);append(m);
  await generate(ch);
}

async function generate(ch){
  const st=CH[ch],body=chatBody(ch);
  const bot={id:uid(),role:'bot',text:'',steps:[],products:[],chips:[],pending:true,time:Date.now()};
  st.msgs.push(bot);if(view!=='staff'&&chan()===ch)append(bot);
  st.busy=true;const my=new AbortController();st.ctl=my;st.chips=[];showChat(ch);
  let cancelled=false;
  try{
    const r=await askServer(body,my.signal);
    setAi('on');
    if(r.refused)bot.err='refused';
    else{
      for(const s of r.steps){
        const step=Object.assign({},s,{ok:false});
        bot.steps.push(step);patch(bot);
        if(S.steps)await wait(250);
        if(my.signal.aborted)throw new Error('stopped');
        step.ok=true;applyStep(step,r,bot,ch);patch(bot);
      }
      bot.text=r.text;
      if(r.truncated)bot.err='cut';
      else if(!clean(r.text)&&!bot.steps.length){bot.err='other';bot.retry=true}
    }
  }catch(e){
    if(my.signal.aborted)cancelled=true;
    else{
      bot.err=e&&e.code||'other';bot.until=e&&e.until||0;
      bot.retry=['busy','network','other'].includes(bot.err);
      if(bot.err==='paused')setAi('off');
    }
  }
  if(st.ctl===my){st.busy=false;st.ctl=null}
  if(!st.msgs.includes(bot))return;
  bot.steps=bot.steps.filter(s=>s.ok);
  if(cancelled&&!clean(bot.text)&&!bot.handoff&&!bot.steps.length){st.msgs=st.msgs.filter(x=>x!==bot);const el=document.getElementById(bot.id);if(el)el.remove();st.chips=null;showChat(ch);return}
  finalize(bot,ch);showChat(ch);
}
function finalize(m,ch){
  m.pending=false;
  const raw=m.text||'';
  const ids=[];
  for(const x of raw.matchAll(/\[\[\s*(p\d{2})\s*\]\]/gi)){const id=x[1].toLowerCase();if(!ids.includes(id)&&prod(id))ids.push(id)}
  m.products=ids.slice(0,4);
  const cm=raw.match(/\[\[\s*chips\s*:([^\]]*)\]\]/i);
  m.chips=cm?cm[1].split('|').map(s=>s.trim()).filter(Boolean).slice(0,3):[];
  if(m.handoff){const tk=tickets.find(x=>x.id===m.handoff);if(tk)tk.transcript=transcript(ch)}
  patch(m);renderStaff();renderTabs();
  CH[ch].chips=m.chips.length?m.chips:null;
}
function retry(id){
  const ch=Object.keys(CH).find(k=>CH[k].msgs.some(m=>m.id===id));
  if(!ch||CH[ch].busy)return;
  const st=CH[ch];
  st.msgs=st.msgs.filter(m=>m.id!==id);
  const el=document.getElementById(id);if(el)el.remove();
  if(st.msgs.length&&st.msgs[st.msgs.length-1].role==='user')generate(ch);
}

function filterText(f){
  const L=S.lang,A=L==='ar'?0:1,parts=[];
  if(FAM[f.family])parts.push(FAM[f.family][L]);
  if(WHO[f.for])parts.push(WHO[f.for][A]);
  if(OCC[f.occasion])parts.push(OCC[f.occasion][A]);
  if(Number(f.max_price)>0)parts.push(T[L].upTo(Number(f.max_price)));
  if(Number(f.min_hours)>0)parts.push(T[L].hrs(Number(f.min_hours)));
  if(f.query){const q=String(f.query).slice(0,30);parts.push(L==='ar'?'«'+q+'»':'“'+q+'”')}
  return parts.join(' · ');
}
function stepLabel(s){
  const L=T[S.lang];
  if(s.k==='search')return s.ok?L.sSearch(filterText(s.f||{}),s.c||0):L.searching;
  if(s.k==='order')return s.ok?L.sOrder(s.n,L.st[s.st]||L.st.none):L.checking;
  if(s.k==='cart')return L.sCart(pname(s.id));
  if(s.k==='hand')return L.sHand(s.id);
  return '';
}
function errLabel(m){
  const L=T[S.lang];
  if(m.err==='cut')return L.cut;
  const e=L.err[m.err]||L.err.other;
  return typeof e==='function'?e(L.wait(((m.until||0)-Date.now())/1000)):e;
}
function art(p,key){
  const f=FAM[p.fam],a=f.c[0],b=f.c[1],g='g'+key.replace(/[^a-z0-9]/gi,''),s=p.id==='p10'?4:f.s;
  const grad='<defs><linearGradient id="'+g+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs>';
  const sh='<ellipse cx="40" cy="113" rx="27" ry="4" fill="#000" opacity=".13"/>';
  const cap=(x,w,y,h)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="#c9a24a"/><rect x="'+(x+3)+'" y="'+(y+2)+'" width="4" height="'+(h-4)+'" rx="2" fill="#f3dc9a" opacity=".8"/>';
  const label='<rect x="25" y="64" width="30" height="20" rx="3" fill="#fff" opacity=".88"/><text x="40" y="78" text-anchor="middle" font-family="Aref Ruqaa,serif" font-size="11" fill="#5a1430">غيم</text>';
  const shine='<rect x="19" y="50" width="4" height="40" rx="2" fill="#fff" opacity=".35"/>';
  let body='';
  if(s===0)body=cap(30,20,6,18)+'<rect x="34" y="24" width="12" height="9" fill="#a8822f"/><path d="M14 47q0-14 14-14h24q14 0 14 14v52q0 11-11 11H25q-11 0-11-11z" fill="url(#'+g+')" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>'+shine+label;
  else if(s===1)body=cap(28,24,4,20)+'<rect x="34" y="24" width="12" height="8" fill="#a8822f"/><path d="M22 32h36l9 16v56q0 6-6 6H19q-6 0-6-6V48z" fill="url(#'+g+')" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><path d="M22 32l-9 16h54l-9-16z" fill="#fff" opacity=".16"/>'+shine+label;
  else if(s===4)body=cap(32,16,10,18)+'<rect x="36" y="28" width="8" height="8" fill="#a8822f"/><path d="M28 48q0-12 12-12t12 12v52q0 10-12 10t-12-10z" fill="url(#'+g+')" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><rect x="32" y="52" width="3" height="36" rx="1.5" fill="#fff" opacity=".35"/>';
  else if(s===2)body='<path d="M33 44q-6-8 0-14t0-14M47 44q6-8 0-14t0-14" stroke="'+a+'" stroke-width="2.5" fill="none" opacity=".7" stroke-linecap="round"/><rect x="13" y="56" width="54" height="52" rx="4" fill="url(#'+g+')"/><rect x="10" y="46" width="60" height="14" rx="3" fill="#c9a24a"/><circle cx="40" cy="82" r="9" fill="#c9a24a" opacity=".9"/>';
  else body='<rect x="12" y="52" width="56" height="56" rx="4" fill="url(#'+g+')"/><rect x="9" y="42" width="62" height="14" rx="3" fill="'+b+'"/><rect x="36" y="42" width="8" height="66" fill="#c9a24a"/><path d="M40 42q-15-17-21-6t21 6q15-17 21-6t-21 6" fill="none" stroke="#c9a24a" stroke-width="4" stroke-linejoin="round"/>';
  return '<svg viewBox="0 0 80 120" aria-hidden="true">'+grad+sh+body+'</svg>';
}
function cardHTML(id,mid){
  const p=prod(id);if(!p)return '';
  const L=S.lang,f=FAM[p.fam];
  const meta=[p.sz?p.sz[0]+' '+T[L].unit[p.sz[1]]:'',p.hours?T[L].lasts(p.hours[0],p.hours[1]):''].filter(Boolean).join(' · ');
  const sk=p.stock===0?'<span class="sk out">'+t('out')+'</span>':p.stock<=5?'<span class="sk low">'+T[L].low(p.stock)+'</span>':'<span class="sk">'+t('inStock')+'</span>';
  return '<div class="pc" style="--c:'+rgba(f.c[1],.16)+'"><div class="ph">'+(p.img?'<img src="'+esc(p.img)+'" alt="'+esc(L==='ar'?p.ar:p.en)+'" width="600" height="400" loading="lazy" decoding="async">':art(p,mid+p.id))+'</div><div class="pb"><span class="fam">'+f[L]+'</span><h4>'+esc(L==='ar'?p.ar:p.en)+'</h4><div class="nt">'+esc(L==='ar'?p.notes_ar:p.notes_en)+'</div>'+(meta?'<div class="mt">'+meta+'</div>':'')+'<div class="pr"><span class="price">'+p.price+' '+t('sar')+'</span>'+sk+'</div><button type="button" class="add" data-add="'+p.id+'"'+(p.stock===0?' disabled':'')+'>'+(p.stock===0?t('soldout'):t('add'))+'</button></div></div>';
}
function hoHTML(id){
  const tk=tickets.find(x=>x.id===id);if(!tk)return '';
  const wa=tk.ch==='wa'?'<div class="mut">'+t('waHere')+'</div>':S.wa?'<a class="wa" href="https://wa.me/'+S.wa+'?text='+encodeURIComponent(T[S.lang].waText(tk.id,tk.summary))+'" target="_blank" rel="noopener">'+I.chat+'<span>'+t('wa')+'</span></a>':'<div class="mut">'+t('waNone')+'</div>';
  return '<div class="ho"><b>'+I.staff+'<span>'+t('hoTitle')+'</span></b><div class="mut">'+t('ticket')+': '+esc(tk.id)+'</div>'+wa+'</div>';
}
function msgHTML(m){
  const tm=m.time?'<div class="tm">'+timeTxt(m.time)+(m.role==='user'?'<span class="ticks">✓✓</span>':'')+'</div>':'';
  if(m.role==='user')return '<div class="msg me" id="'+m.id+'"><div class="bub"><div class="txt" dir="auto">'+fmt(m.text)+'</div>'+tm+'</div></div>';
  const text=m.welcome?t('welcome'):clean(m.text);
  const steps=S.steps&&m.steps&&m.steps.length?'<div class="steps">'+m.steps.map(s=>'<div class="step'+(s.ok?'':' run')+'">'+(s.ok?I.check:I.spin)+'<span>'+esc(stepLabel(s)).replace(/(T-\d+)/g,'<bdi class="nw">$1</bdi>')+'</span></div>').join('')+'</div>':'';
  const typing=m.pending&&!text?'<div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>':'';
  const err=m.err?'<div class="err"><span>'+esc(errLabel(m))+'</span>'+(m.retry?'<button type="button" class="retry" data-retry="'+m.id+'">'+t('retry')+'</button>':'')+(planErr(m)?'<p class="plan">'+planHtml()+'</p>':'')+'</div>':'';
  const cards=m.products&&m.products.length?'<div class="cards">'+m.products.map(id=>cardHTML(id,m.id)).join('')+'</div>':'';
  const ho=m.handoff?hoHTML(m.handoff):'';
  const inner=steps+typing+(text?'<div class="txt" dir="auto">'+fmt(text)+'</div>':'')+err+(text&&!m.pending?tm:'');
  return '<div class="msg bot'+(cards?' wide':'')+'" id="'+m.id+'"><div class="body">'+(inner?'<div class="bub">'+inner+'</div>':'')+cards+ho+'</div></div>';
}

function nearBottom(){const l=$('#log');return l.scrollHeight-l.scrollTop-l.clientHeight<160}
function toBottom(){const l=$('#log');l.scrollTop=l.scrollHeight}
function append(m){const l=$('#log');l.insertAdjacentHTML('beforeend',msgHTML(m));const el=l.lastElementChild;if(el&&el.classList)el.classList.add('enter');toBottom()}
function patch(m){const el=document.getElementById(m.id);if(!el)return;const nb=nearBottom();el.outerHTML=msgHTML(m);if(nb)toBottom()}
function renderLog(){$('#log').innerHTML=(view==='wa'?'<div class="wanote">'+t('waPreview')+'</div>':'')+cur().msgs.map(msgHTML).join('');toBottom()}
function setChips(list){
  const arr=list==null?T[S.lang].starters:list;
  $('#chips').innerHTML=arr.map(c=>'<button type="button" class="chip" dir="auto">'+esc(c)+'</button>').join('');
}
function setComposer(){
  const busy=cur().busy,b=$('#sendBtn');b.innerHTML=busy?I.stop:I.send;b.setAttribute('aria-label',busy?t('stop'):t('send'));
  $('#q').disabled=busy;
}
function renderStatus(){
  const d=$('#dot');d.className='dot'+(aiState==='on'?' on':aiState==='off'?' off':'');
  $('#status').textContent=aiState==='on'?t('online'):aiState==='off'?t('offline'):t('connecting');
}
function renderTabs(){
  const n=tickets.filter(x=>x.status==='waiting').length;
  $('#tabStaff').innerHTML=esc(t('staff'))+(n?'<span class="cnt">'+n+'</span>':'');
}
function renderCartBadge(){const n=Object.values(cur().cart).reduce((a,b)=>a+b,0);const b=$('#cartN');b.textContent=n;b.hidden=!n}
function renderSide(){
  const L=T[S.lang],ic={search:I.search,order:I.order,cart:I.bag,staff:I.staff};
  $('#side').innerHTML='<h3>'+L.sideTitle+'</h3><p class="mut">'+L.sideLead+'</p>'+L.tools.map(x=>'<div class="tool">'+ic[x[0]]+'<div><b>'+x[1]+'</b><span>'+x[2]+'</span></div></div>').join('')+(ORDERS.length?'<h4>'+L.tryOrders+'</h4><div class="orders">'+ORDERS.map(n=>'<button type="button" class="chip" data-order="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>':'')+'<p class="mut small">'+(providerName()?L.engine(providerName())+' · ':'')+(S.speed==='smart'?L.modeSmart:L.modeFast)+(aiState==='on'?' · '+L.toolsOn:'')+'</p>';
}
function timeTxt(s){try{return new Date(s).toLocaleTimeString(S.lang==='ar'?'ar-u-nu-latn':'en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function renderStaff(){
  const el=$('#tickets');
  if(!tickets.length){el.innerHTML='<div class="empty">'+I.staff+'<h3>'+t('staffTitle')+'</h3><p>'+t('staffEmpty')+'</p></div>';return}
  el.innerHTML='<h3 class="sh">'+t('staffTitle')+'</h3>'+tickets.slice().reverse().map(tk=>'<article class="tk"><header><span><bdi>'+esc(tk.id)+'</bdi> · <bdi>'+timeTxt(tk.time)+'</bdi></span><span class="pill'+(tk.status==='done'?' done':'')+'">'+(tk.status==='done'?t('resolved'):t('waiting'))+'</span></header><div class="ch">'+t('chLabel')+': '+(tk.ch==='wa'?t('chWa'):t('chWeb'))+'</div>'+(tk.reason?'<div><b>'+t('reason')+':</b> <span dir="auto">'+esc(tk.reason)+'</span></div>':'')+'<div><b>'+t('summary')+'</b><p dir="auto">'+esc(tk.summary)+'</p></div><details><summary>'+t('transcript')+' ('+tk.transcript.length+')</summary><div class="tr">'+tk.transcript.map(x=>'<div><b>'+(x.who==='user'?t('customer'):t('assistant'))+':</b> <span dir="auto">'+esc(x.text)+'</span></div>').join('')+'</div></details><button type="button" class="ghost" data-done="'+esc(tk.id)+'">'+(tk.status==='done'?t('reopen'):t('markDone'))+'</button></article>').join('');
}
function setView(v){
  const was=view;
  if(was!=='staff')cur().draft=$('#q').value;
  view=v;
  if(v!=='staff')lastChat=v==='wa'?'wa':'web';
  $('#chatView').hidden=v==='staff';$('#staffView').hidden=v!=='staff';
  $('#chatView').classList.toggle('wamode',v==='wa');
  $('#tabChat').setAttribute('aria-selected',String(v==='chat'));$('#tabWa').setAttribute('aria-selected',String(v==='wa'));$('#tabStaff').setAttribute('aria-selected',String(v==='staff'));
  if(v==='staff')renderStaff();
  else if(was!==v){renderLog();$('#q').value=cur().draft;setChips(cur().chips);setComposer();renderCartBadge();if(sheetKind==='cart')renderSheet()}
}
function renderSheet(){
  const pn=$('#panel'),L=S.lang;
  if(sheetKind==='cart'){
    const c=cartSummary();
    pn.innerHTML='<h3>'+t('cart')+'</h3>'+(c.items.length?c.items.map(i=>'<div class="line"><span dir="auto">'+esc(L==='ar'?i.name_ar:i.name_en)+' × '+i.qty+'</span><span class="price">'+i.qty*i.price_sar+' '+t('sar')+'</span><button type="button" class="x" data-rm="'+i.id+'">'+t('remove')+'</button></div>').join('')+'<div class="line"><b>'+t('total')+'</b><span class="price">'+c.total_sar+' '+t('sar')+'</span></div><p class="hint">'+t('cartNote')+'</p>':'<p class="mut">'+t('cartEmpty')+'</p>')+'<button type="button" class="prim" data-close>'+t('done')+'</button>';
  }else if(sheetKind==='settings'){
    pn.innerHTML='<h3>'+t('settings')+'</h3><div class="fld"><label for="waIn">'+t('waLabel')+'</label><input id="waIn" inputmode="tel" dir="ltr" value="'+esc(S.wa)+'" placeholder="966501234567"><p class="hint">'+t('waHint')+'</p></div><div class="fld"><span class="lbl">'+t('speed')+'</span><div class="seg"><button type="button" data-speed="fast" aria-pressed="'+(S.speed!=='smart')+'">'+t('fast')+'</button><button type="button" data-speed="smart" aria-pressed="'+(S.speed==='smart')+'">'+t('smart')+'</button></div></div><div class="fld"><span class="lbl">'+t('stepsLabel')+'</span><div class="seg"><button type="button" data-steps="1" aria-pressed="'+S.steps+'">'+t('on')+'</button><button type="button" data-steps="0" aria-pressed="'+!S.steps+'">'+t('off')+'</button></div></div><div class="fld"><button type="button" class="ghost" data-reset>'+t('reset')+'</button><p class="hint">'+t('resetHint')+'</p></div><p class="hint">'+t('about')(providerName())+'</p><button type="button" class="prim" data-close>'+t('done')+'</button>';
  }
}
function openSheet(k){sheetKind=k;renderSheet();$('#sheet').classList.add('open')}
function closeSheet(){if(!sheetKind)return;sheetKind=null;$('#sheet').classList.remove('open');renderLog()}
function applyLang(){
  const L=S.lang,root=document.documentElement;
  root.lang=L;root.dir=L==='ar'?'rtl':'ltr';document.title=t('title');
  $('#name').textContent=t('store');$('#langBtn').textContent=t('langBtn');$('#langBtn').setAttribute('aria-label',t('langAria'));
  $('#cartBtn').setAttribute('aria-label',t('cartAria'));$('#setBtn').setAttribute('aria-label',t('setAria'));
  $('#tabChat').textContent=t('chat');$('#tabWa').textContent=t('waTab');$('#note').textContent=t('note');$('#q').placeholder=t('ph');
  $('#waName').textContent=t('store');$('#waSub').textContent=t('waBiz');
  renderStatus();renderPnote();renderTabs();renderLog();renderStaff();renderSide();setChips(cur().chips);renderCartBadge();setComposer();
}
function resetAll(){
  for(const c of Object.keys(CH)){if(CH[c].ctl)CH[c].ctl.abort();resetChat(c)}
  tickets=[];$('#q').value='';
  sheetKind=null;$('#sheet').classList.remove('open');setView('chat');applyLang();
}

$('#form').addEventListener('submit',e=>{e.preventDefault();const st=cur();if(st.busy){if(st.ctl)st.ctl.abort();return}send($('#q').value)});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)send(c.textContent)});
$('#log').addEventListener('click',e=>{
  const a=e.target.closest('[data-add]');
  if(a){if(addToCart(a.dataset.add,1)){a.textContent=t('added');setTimeout(()=>{a.textContent=t('add')},1400)}return}
  const r=e.target.closest('[data-retry]');if(r)retry(r.dataset.retry);
});
$('#side').addEventListener('click',e=>{const b=e.target.closest('[data-order]');if(b)send(T[S.lang].askOrder(b.dataset.order))});
$('#tickets').addEventListener('click',e=>{const b=e.target.closest('[data-done]');if(!b)return;const tk=tickets.find(x=>x.id===b.dataset.done);if(tk){tk.status=tk.status==='done'?'waiting':'done';renderStaff();renderTabs()}});
$('#tabChat').addEventListener('click',()=>setView('chat'));
$('#tabWa').addEventListener('click',()=>setView('wa'));
$('#tabStaff').addEventListener('click',()=>setView('staff'));
$('#cartBtn').addEventListener('click',()=>openSheet('cart'));
$('#setBtn').addEventListener('click',()=>openSheet('settings'));
$('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';saveS();applyLang()});
$('#sheet').addEventListener('click',e=>{
  if(e.target===e.currentTarget||e.target.closest('[data-close]')){closeSheet();return}
  const rm=e.target.closest('[data-rm]');if(rm){delete cur().cart[rm.dataset.rm];renderCartBadge();renderSheet();return}
  const sp=e.target.closest('[data-speed]');if(sp){S.speed=sp.dataset.speed;saveS();renderSheet();renderSide();return}
  const st=e.target.closest('[data-steps]');if(st){S.steps=st.dataset.steps==='1';saveS();renderSheet();return}
  if(e.target.closest('[data-reset]'))resetAll();
});
$('#sheet').addEventListener('input',e=>{if(e.target.id==='waIn'){S.wa=digits(e.target.value);saveS()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function start(){
  resetChat('web');resetChat('wa');tickets=[];
  applyLang();
}
async function boot(){
  applyLang();
  checkHealth();
  try{
    const r=await fetch('data/products.json',{cache:'no-cache'});
    const d=await r.json();
    FAM=d.families||{};WHO=d.who||{};OCC=d.occasions||{};
    P=Array.isArray(d.products)?d.products:[];
    ORDERS=Array.isArray(d.sample_orders)?d.sample_orders.map(String):[];
  }catch(e){}
  start();
}
boot();
}
</script>
